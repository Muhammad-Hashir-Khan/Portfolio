<!doctype html>
<html>
<head><meta charset="utf-8" /><title>chatprobe</title></head>
<body>
<iframe id="f" style="width:1200px;height:900px;border:0"></iframe>
<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener('load', () => {
    // relative src: locally -> localhost:8787/#/  ·  live -> .../Portfolio/#/
    document.getElementById('f').src = './' + '#/';
    setTimeout(async () => {
      try {
        const f = document.getElementById('f');
        const d = f.contentDocument;
        const w = f.contentWindow;
        d.querySelector('.chat-launcher').click();
        await sleep(800);
        const input = d.querySelector('.chat-input');
        const setter = Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype, 'value').set;
        setter.call(input, 'What are the starting prices?');
        input.dispatchEvent(new w.Event('input', { bubbles: true }));
        await sleep(200);
        d.querySelector('.chat-panel__form').dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
        await sleep(9000);
        const replies = [...d.querySelectorAll('.chat-msg--assistant')].map((m) => m.textContent.trim());
        const subtitle = d.querySelector('.chat-panel__title span:last-child').textContent.trim();
        document.body.textContent =
          'SUBTITLE>> ' + subtitle + ' ||REPLIES>> ' + JSON.stringify(replies, null, 1);
      } catch (e) {
        document.body.textContent = 'ERR ' + e.message;
      }
    }, 12000);
  });
</script>
</body>
</html>
